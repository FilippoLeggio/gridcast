# Local dependencies for fast development: database, object storage,
# experiment tracking
---
name: gridcast

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.22
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
     -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  # One-shot job: waits for the S3 API, then creates the buckets.
  create-buckets:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3 ls > /dev/null 2>&1;
         do
          echo "waiting for seaweedfs..."

          sleep 2
        done
        for bucket in mlflow backups; do
          aws --endpoint-url http://seaweedfs:8333
          s3 mb "s3://$$bucket" 2> /dev/null \
            || echo "bucket $$bucket already exists"
        done
    restart: "no"

  mlflow:
    build: ./compose/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql:
      //${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
    ports:
      - "5000:5000"

volumes:
  pgdata:
  s3data:
