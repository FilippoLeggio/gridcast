{{- if .Values.metrics.serviceMonitor.enabled }}
# Tells the Prometheus Operator to scrape /metrics from the API pods behind the Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "gridcast.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Stable labels only: the version label changes at every release.
  selector:
    matchLabels:
      app.kubernetes.io/name: gridcast
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
