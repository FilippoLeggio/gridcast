{{- if .Values.metrics.serviceMonitor.enabled }}
# Grafana's dashboard sidecar loads every ConfigMap carrying the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-ops
  labels:
    {{- include "gridcast.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  gridcast-ops.json: |-
{{ .Files.Get "dashboards/gridcast-ops.json" | indent 4 }}
{{- end }}
