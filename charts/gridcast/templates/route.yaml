{{- if .Values.api.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "gridcast.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Attach to the Gateway owned by the platform, in its own namespace.
  parentRefs:
    - name: {{ .Values.api.route.gateway.name }}
      namespace: {{ .Values.api.route.gateway.namespace }}
  hostnames:
    - {{ .Values.api.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-api
          port: 80
{{- end }}
