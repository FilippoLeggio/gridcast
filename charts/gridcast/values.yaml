# Images: ghcr.io/<owner>/gridcast-<component>:<tag>, the tag being a short commit SHA.
image:
  registry: ghcr.io/filippoleggio
  tag: ""
  pullPolicy: IfNotPresent

# PostgreSQL managed by the CloudNativePG operator.
database:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17
  storageSize: 2Gi

api:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    # Memory limit only: a CPU limit would throttle request spikes for no benefit.
    limits:
      memory: 384Mi
      # Public HTTP route through the platform Gateway.
  route:
    enabled: true
    hostname: gridcast.localhost
    gateway:
      name: traefik-gateway
      namespace: traefik

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

networkPolicy:
  enabled: true
  # Namespace of the Gateway controller allowed to reach the API.
  gatewayNamespace: traefik
  # Namespace of the CloudNativePG operator, which manages the database pods.
  operatorNamespace: cnpg-system

migrations:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Resources for scheduled jobs that do not set their own.
jobDefaults:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# Scheduled jobs. Times are in Italian local time (see timeZone in the template).
# Minutes are staggered so that jobs do not all start together.
cronJobs:
  ingest-energy:
    component: ingest
    schedule: "7 * * * *"
    args: ["energy", "--days", "3"]
  ingest-weather:
    component: ingest
    schedule: "12 * * * *"
    args: ["weather"]
  # Templates only: suspended, started by hand with "kubectl create job --from=cronjob/...".
  backfill-energy:
    component: ingest
    schedule: "0 0 1 1 *"
    suspend: true
    activeDeadlineSeconds: 3600
    args: ["backfill-energy", "--start", "2024-01-01", "--end", "2026-11-02"]
  backfill-weather:
    component: ingest
    schedule: "0 0 1 1 *"
    suspend: true
    activeDeadlineSeconds: 3600
    args: ["backfill-weather", "--start", "2024-01-01", "--end", "2026-10-27"]
    # Daily retraining, once yesterday's load is complete (published about 3 hours late).

  train:
    component: trainer
    schedule: "20 5 * * *"
    usesMlflow: true
    activeDeadlineSeconds: 3600
    args: ["train"]
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  # Daily forecast of tomorrow, issued at 10:00 with the champion model.
  predict:
    component: trainer
    schedule: "5 10 * * *"
    usesMlflow: true
    args: ["predict"]
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
# MLflow tracking server, installed by the separate mlflow chart.
mlflow:
  trackingUri: http://mlflow.mlflow.svc.cluster.local:5000
