images:
  mlflow: ghcr.io/filippoleggio/gridcast-mlflow:3.1.0
  seaweedfs: chrislusf/seaweedfs:4.22
  pullPolicy: IfNotPresent

# Existing secret with keys access-key and secret-key, never created by this chart.
s3:
  credentialsSecret: seaweedfs-s3
  buckets: ["mlflow", "backups"]

storage:
  size: 5Gi

database:
  image: ghcr.io/cloudnative-pg/postgresql:17
  storageSize: 1Gi

server:
  # Host headers accepted by MLflow (3.5+ rejects unknown hosts): in-cluster names,
  # port-forwards, and pod IPs used by the kubelet for health probes.
  allowedHosts: "mlflow:5000,mlflow.mlflow:5000,mlflow.mlflow.svc.cluster.local:5000,localhost:*,10.*"
  workers: 2
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi
