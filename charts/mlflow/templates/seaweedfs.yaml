apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  # One volume, writable by one pod: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        {{- include "mlflow.labels" . | nindent 8 }}
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.images.seaweedfs }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=1024"]
          env:
            {{- include "mlflow.s3Env" . | nindent 12 }}
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
