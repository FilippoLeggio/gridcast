[project]
name = "gridcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Filippo Leggio", email = "filippo.leggio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "tzdata>=2026.6",
]

[project.scripts]
gridcast-ingest = "gridcast.ingest.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads these calls only to build the CLI: they are safe as defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
