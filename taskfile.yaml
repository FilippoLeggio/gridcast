# Every project command lives here. Run `task` to list them.
---
version: "3"
dotenv: [".env"]

vars:
  CLUSTER: gridcast-dev

tasks:
  default:
    cmds:
      - task --list
    silent: true

  tools:
    desc: Check that every required tool is installed
    cmds:
      - ./scripts/check-tools.sh

  dev-up:
    desc: Create the local k3d cluster
    cmds:
      - k3d cluster create --config k3d/dev.yaml
      - kubectl wait --for=condition=Ready nodes --all --timeout=120s
    status:
      # Skip creation if the cluster already exists.
      - k3d cluster get {{.CLUSTER}}

  dev-down:
    desc: Delete the local k3d cluster
    cmds:
      - k3d cluster delete {{.CLUSTER}}

  dev-status:
    desc: Show nodes and pods of the local cluster
    cmds:
      - kubectl get nodes -o wide
      - kubectl get pods -A

  lint:
    desc: Run all pre-commit hooks on every file
    cmds:
      - pre-commit run --all-files

  deps-up:
    desc: Start local dependencies (Postgres, SeaweedFS, MLflow)
    preconditions:
      - sh: test -f .env
        msg: "Missing .env: copy .env.example to .env first"
    cmds:
      - docker compose up -d --build

  deps-down:
    desc: Stop local dependencies, keeping their data
    cmds:
      - docker compose down

  deps-reset:
    desc: Stop local dependencies and delete their data
    cmds:
      - docker compose down -v

  deps-logs:
    desc: Follow the logs of local dependencies
    cmds:
      - docker compose logs -f

  db-migrate:
    desc: Apply database migrations
    dir: app
    cmds:
      - uv run alembic upgrade head

  ingest-energy:
    desc: "Fetch recent Energy-Charts data
     (extra args: task ingest-energy -- --days 7)"
    dir: app
    cmds:
      - uv run gridcast-ingest energy {{.CLI_ARGS}}

  ingest-weather:
    desc: "Fetch recent and upcoming Open-Meteo weather data
      (extra args after --)"
    dir: app
    cmds:
      - uv run gridcast-ingest weather {{.CLI_ARGS}}

  test:
    desc: Run the Python test suite
    dir: app
    cmds:
      - uv run --all-extras pytest

  backfill-energy:
    desc: "Load Energy-Charts history"
    dir: app
    cmds:
      - uv run gridcast-ingest backfill-energy {{.CLI_ARGS}}

  backfill-weather:
    desc: "Load Open-Meteo archive history"
    dir: app
    cmds:
      - uv run gridcast-ingest backfill-weather {{.CLI_ARGS}}

  train-inspect:
    desc: "Summarize the modelling dataset
      (task train-inspect -- --start 2024-01-01 --end 2026-11-04)"
    dir: app
    cmds:
      - uv run --extra trainer gridcast-train inspect {{.CLI_ARGS}}

  train:
    desc: "Walk-forward validation, training and registration in MLflow (args after --)"
    dir: app
    cmds:
      - uv run --extra trainer gridcast-train train {{.CLI_ARGS}}

  predict:
    desc: "Forecast tomorrow's hourly load with the champion model (args after --)"
    dir: app
    cmds:
      - uv run --extra trainer gridcast-train predict {{.CLI_ARGS}}

  api:
    desc: Run the API locally with auto-reload on http://localhost:8000
    dir: app
    cmds:
      - uv run --extra api uvicorn gridcast.api.main:app --reload --port 8000

  images:
    desc: Build the ingest, trainer and api images locally
    dir: app
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - for: [ingest, trainer, api]
        cmd: docker build --target {{.ITEM}} --build-arg GIT_COMMIT={{.COMMIT}} -t gridcast-{{.ITEM}}:dev .

  images-push-local:
    desc: Push the dev images to the local k3d registry
    cmds:
      - for: [ingest, trainer, api]
        cmd: docker tag gridcast-{{.ITEM}}:dev localhost:5050/gridcast-{{.ITEM}}:dev && docker push localhost:5050/gridcast-{{.ITEM}}:dev

  chart-dev:
    desc: Install or upgrade the chart on the local k3d cluster with the dev images
    cmds:
      - >-
        helm upgrade --install gridcast charts/gridcast
        --namespace gridcast --create-namespace
        -f charts/gridcast/values-dev.yaml
        --wait --timeout 5m
  dev-redeploy:
    desc: Redeploy the chart with the dev images after a code change
    cmds:
      - task images
      - task images-push-local
      - task chart-dev

  mlflow-image-local:
    desc: Build the MLflow server image and push it to the k3d registry
    cmds:
      - docker build -t localhost:5050/gridcast-mlflow:dev compose/mlflow
      - docker push localhost:5050/gridcast-mlflow:dev
