# Build, scan and publish the MLflow server image, only when its files change.
name: mlflow-image

on:
  pull_request:
    paths:
      - compose/mlflow/**
      - .github/workflows/mlflow-image.yaml
  push:
    branches: [main]
    paths:
      - compose/mlflow/**
      - .github/workflows/mlflow-image.yaml

concurrency:
  group: mlflow-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mlflow image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Keep in sync with the pin in compose/mlflow/Dockerfile.
      MLFLOW_VERSION: "3.18.0"
    steps:
      - uses: actions/checkout@v5

      - name: Lint the Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint < compose/mlflow/Dockerfile

      - name: Compute image name and tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/gridcast-mlflow" >> "$GITHUB_ENV"
          echo "TAG=${MLFLOW_VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: compose/mlflow
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,mode=max,scope=mlflow

      - name: Scan for vulnerabilities with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1 image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          "$IMAGE:$TAG"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$TAG"
