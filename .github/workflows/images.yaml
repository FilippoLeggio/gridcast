# Build and scan the three container images; publish them to GHCR on main.
name: images

on:
  # Pull requests always build and scan: these checks are required by the ruleset.
  pull_request:
  # On main, publish (and promote) only when the image contents change.
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/images.yaml

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the Dockerfiles with hadolint
        run: |
          docker run --rm -i hadolint/hadolint < app/Dockerfile
  build:
    name: Build ${{ matrix.component }}
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    # Only this job may write packages, and only to publish on main.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ingest
            context: app
            target: ingest
            tag-prefix: ""
          - component: trainer
            context: app
            target: trainer
            tag-prefix: ""
          - component: api
            context: app
            target: api
            tag-prefix: ""
    steps:
      - uses: actions/checkout@v5

      - name: Compute image name and tag
        run: |
          # GHCR requires lowercase names; the tag is the short commit SHA.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/gridcast-${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "TAG=${{ matrix.tag-prefix }}${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan for vulnerabilities with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1 image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          "$IMAGE:$TAG"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$TAG"

  promote-dev:
    name: Promote to dev
    # Only after all images are built, scanned and pushed from main.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One promotion at a time: queued, never cancelled, so no release is lost.
    concurrency:
      group: promote-dev
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check out the GitOps repository
        uses: actions/checkout@v5
        with:
          repository: FilippoLeggio/gridcast-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Open and merge the promotion pull request
        working-directory: gitops
        run: |
          tag="${GITHUB_SHA::7}"
          yq -i ".image.tag = \"${tag}\"" apps/gridcast/dev/values.yaml
          if git diff --quiet; then
            echo "dev already runs ${tag}: nothing to promote"
            exit 0
          fi

          branch="promote/dev-${tag}"
          git config user.name "gridcast-ci"
          git config user.email "gridcast-ci@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "deploy(dev): gridcast ${tag}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push -u origin "${branch}"

          gh pr create --base main --head "${branch}" \
            --title "deploy(dev): gridcast ${tag}" \
            --body "Automated promotion of ${GITHUB_REPOSITORY}@${GITHUB_SHA} to dev."
          gh pr merge "${branch}" --squash --delete-branch
